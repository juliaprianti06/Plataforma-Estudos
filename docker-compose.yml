services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: estudos_colaborativos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estudos_colaborativos"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./server
    restart: always
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app          
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./web
    restart: always
    env_file:
      - ./web/.env
    volumes:
      - ./web:/app
      - /app/node_modules      
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata: