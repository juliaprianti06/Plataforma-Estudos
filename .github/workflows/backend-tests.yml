name: Backend tests

on:
  pull_request:
    paths: ["server/**", "docker-compose.yml", ".github/workflows/backend-tests.yml"]
  push:
    paths: ["server/**", "docker-compose.yml", ".github/workflows/backend-tests.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: estudos_colaborativos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d estudos_colaborativos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/estudos_colaborativos_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
